<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mercury Map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercury Map">
<meta name="theme-color" content="#0d0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="datepill glass">
    <button class="arrow" id="prevDay" aria-label="Предыдущий день"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="label" id="dateLabel"><b id="dateTitle">Сегодня</b><small id="dateSub">0 км</small></button>
    <button class="arrow" id="nextDay" aria-label="Следующий день"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <button class="iconbtn glass" id="listBtn" aria-label="Партнёры"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="badge" id="pCount">0</span></button>
  <button class="iconbtn glass" id="layersBtn" aria-label="Настройки"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg><span class="sync" id="syncDot"></span></button>
</div>

<div class="scopebar glass"><button id="scDay" class="sel">День</button><button id="scAll">Вся история</button></div>
<button class="rec glass" id="recChip"><i></i><span id="recText">Запись</span></button>
<div class="people" id="people"></div>
<div class="eraser-ring" id="ring"></div>
<div class="palette glass" id="palette"></div>

<div class="dock glass" id="dock"></div>

<div class="toast glass" id="toast"></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div></div>

<div class="auth" id="auth"><div class="auth-card" id="authCard"></div></div>

<script src="leaflet.js"></script>
<script>window.L||(document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>'))</script>
<script src="app.js"></script>
</body>
</html>
